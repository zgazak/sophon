name: cartesian_scale
description: "2D Cartesian scale detection"
coordinate_system: cartesian_2d
points:
  num_points: [30, 60]
  distribution: uniform
  margin: 0.1
transforms:
  scale: [-0.3, 0.3]
questions:
  - type: binary
    alignment_threshold: 0.05
  - type: comparative
  - type: quantitative
num_samples: 200
seed: 42
