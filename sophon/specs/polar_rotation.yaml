name: polar_rotation
description: "Polar angular rotation detection"
coordinate_system: polar
points:
  num_points: [30, 60]
  distribution: uniform
  margin: 0.1
transforms:
  angular_rotation_deg: [-45, 45]
questions:
  - type: binary
    alignment_threshold: 0.05
  - type: categorical
  - type: quantitative
num_samples: 200
seed: 42
