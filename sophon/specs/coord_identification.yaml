name: coord_identification
description: "Coordinate system identification (3-way: linear, Cartesian, circular). Grids are disabled — model identifies from point distribution alone."
coordinate_system: cartesian_2d
points:
  num_points: [30, 60]
  distribution: uniform
  margin: 0.1
transforms:
  translation_x: [0, 0]
questions:
  - type: coord_identification
num_samples: 200
seed: 42
