name: cartesian_translation_y
description: "2D Cartesian vertical translation detection"
coordinate_system: cartesian_2d
points:
  num_points: [30, 60]
  distribution: uniform
  margin: 0.1
transforms:
  translation_y: [-0.15, 0.15]
questions:
  - type: binary
    alignment_threshold: 0.05
  - type: categorical
num_samples: 200
seed: 42
