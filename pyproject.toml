[project]
name = "sophon-bench"
version = "0.3.3"
description = "Generative benchmark for probing spatial reasoning in VLMs across coordinate geometries"
readme = "README.md"
license = "MIT"
authors = [{ name = "Zach Gazak", email = "jzg@alum.mit.edu" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "numpy>=1.26",
    "matplotlib~=3.10",
    "Pillow~=12.1",
    "pydantic>=2.0",
    "PyYAML",
    "click",
]

[project.urls]
Homepage = "https://github.com/zgazak/sophon"
Repository = "https://github.com/zgazak/sophon"
Issues = "https://github.com/zgazak/sophon/issues"

[project.optional-dependencies]
eval = [
    "transformers",
    "torch",
    "openai",
    "anthropic",
    "accelerate",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "build",
    "twine",
]

[project.scripts]
sophon = "sophon.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Allowlists, not exclude lists: repo tooling (CLAUDE.md, .github/, docs/,
# Makefile, ...) can never leak into a release. pyproject.toml is always added.
[tool.hatch.build.targets.sdist]
only-include = ["sophon", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["sophon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
